<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZFA Fachkunde-Quiz LF 2-5</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#14201e;--mut:#5d6b69;--line:#dfe7e5;--ok:#15803d;--okb:#e8f6ed;--bad:#c2410c;--badb:#fdeee6;--acc:#0f766e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;color:var(--ink)}
.top .t{font-weight:700;font-size:16px;flex:1;line-height:1.2}
.top .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}
.lf{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:6px solid var(--c)}
.lf .tag{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.04em}
.lf h3{margin:2px 0 8px;font-size:17px;line-height:1.25}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .3s}
.meta{font-size:12px;color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border:0;border-radius:12px;padding:11px 10px;font-weight:650;font-size:14px;cursor:pointer;background:var(--bg);color:var(--ink)}
.btn.p{background:var(--c,var(--acc));color:#fff}
.wide{display:block;width:100%;padding:15px;font-size:16px;border-radius:14px;margin-top:10px}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.tile{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);color:var(--ink);font:inherit}
.tile b{display:block;font-size:15px}
.tile span{font-size:12px;color:var(--mut)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog .bar{flex:1;margin:0;height:8px}
.prog span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:20px;padding:20px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:14px}
.qcard .lbl{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.04em;margin-bottom:6px}
.qcard h2{font-size:19px;line-height:1.35;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.fb{border-radius:14px;padding:13px 15px;margin:4px 0 6px;font-size:15px}
.fb.ok{background:var(--okb);color:#0f5132}.fb.bad{background:var(--badb);color:#7a2a07}
.fb b{display:block;margin-bottom:3px}
.wis{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.wis h4{margin:0 0 6px;font-size:15px;color:var(--c)}
.wis ul{margin:0;padding-left:18px}.wis li{margin:4px 0;font-size:15px}
.res{text-align:center;padding:26px 10px 8px}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:800}
.res h2{margin:4px 0}
.list{text-align:left;margin-top:16px}
.wr{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.wr b{color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.reset{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;margin:18px auto 0;display:block;cursor:pointer}
.confirm{background:var(--badb);border-radius:14px;padding:12px;margin-top:10px;font-size:14px;text-align:center}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--card:#19211f;--ink:#e8efed;--mut:#9aa8a5;--line:#2b3633;--okb:#12301f;--badb:#3a1d10}.fb.ok{color:#a7e3bd}.fb.bad{color:#f7c2a6}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = [{"key": "lf2", "nr": "2", "titel": "Patienten empfangen und begleiten", "kompakt": [["Empfang & Aufnahme", ["Freundlich begrüßen, mit Namen ansprechen, Diskretion am Tresen (Abstand, leise).", "GKV: eGK mind. <b>1× pro Quartal</b> einlesen. Ohne Karte: innerhalb von 10 Tagen nachreichen, sonst Privatrechnung möglich.", "PKV: Patient ist selbst Vertragspartner, bekommt Rechnung nach <b>GOZ</b> und reicht sie bei seiner PKV ein.", "Sonstige Kostenträger: Sozialamt, Bundeswehr/Polizei (Heilfürsorge), <b>Berufsgenossenschaft</b> bei Arbeits-/Wegeunfall."]], ["Anamnese", ["Allgemeinanamnese: Vorerkrankungen (Herz, Diabetes, Epilepsie, Infektionen), Allergien, Schwangerschaft, <b>Medikamente</b>.", "Wichtig: <b>Blutverdünner</b> (Nachblutung), Bisphosphonate (Kiefernekrose), Herzklappen-Patienten (Endokarditisprophylaxe).", "Spezielle (zahnärztliche) Anamnese: aktuelle Beschwerden, frühere Behandlungen.", "Eigenanamnese = Patient selbst; Fremdanamnese = Angehörige/Betreuer berichten.", "Anamnese regelmäßig aktualisieren und vom Patienten unterschreiben lassen."]], ["Recht", ["Behandlungsvertrag (§ 630a BGB) = <b>Dienstvertrag</b>: Behandlung nach Standard, kein Erfolg geschuldet.", "Aufklärungspflicht (§ 630e): <b>mündlich, rechtzeitig, verständlich</b> vor dem Eingriff. Dokumentationspflicht (§ 630f), Einsichtsrecht (§ 630g).", "Patientenakte: <b>10 Jahre</b> nach Abschluss der Behandlung aufbewahren.", "Geschäftsfähigkeit: unter 7 J. geschäftsunfähig, 7-17 beschränkt geschäftsfähig, ab 18 voll.", "Schweigepflicht: <b>§ 203 StGB</b>, gilt für alle Mitarbeiter, auch gegenüber Angehörigen und <b>nach Ende</b> des Arbeitsverhältnisses. Entbinden kann nur der Patient.", "DSGVO: Gesundheitsdaten = <b>besondere Kategorie</b> personenbezogener Daten (Art. 9). Recall nur mit Einwilligung."]], ["Kommunikation", ["4-Seiten-Modell (Schulz von Thun): <b>Sachinhalt, Selbstoffenbarung, Beziehung, Appell</b>.", "Verbal (Worte): nonverbal (Mimik, Gestik, Blickkontakt, Haltung): paraverbal (Tonfall, Lautstärke).", "Offene Fragen (W-Fragen) = viele Infos; geschlossene Fragen = Ja/Nein.", "Aktives Zuhören, Ich-Botschaften, keine Fachsprache gegenüber Patienten."]], ["Besondere Patienten & Notfälle", ["Angstpatienten: ernst nehmen, Ablauf erklären, <b>Stopp-Zeichen</b> vereinbaren, kurze Wartezeit.", "Kinder: <b>Tell-Show-Do</b> (erklären, zeigen, machen), kindgerechte Sprache, loben.", "Senioren: langsam & deutlich sprechen, Hilfe beim Hinsetzen, Medikamentenliste.", "Kollaps (Synkope): <b>Schocklage</b> / Beine hoch. Unterzucker: <b>Zucker</b> geben (wenn wach). Notruf <b>112</b>."]]], "fragen": [["Wie oft muss die eGK eines Kassenpatienten mindestens eingelesen werden?", "Einmal pro Quartal", ["Bei jedem Besuch", "Einmal pro Jahr", "Nur beim allerersten Besuch"], "Die eGK wird beim ersten Besuch im Quartal eingelesen. Fehlt sie, kann sie innerhalb von 10 Tagen nachgereicht werden."], ["Warum fragst du in der Anamnese gezielt nach Blutverdünnern?", "Wegen erhöhter Nachblutungsgefahr bei Eingriffen", ["Weil sie die Betäubung verstärken", "Wegen der Abrechnung", "Weil sie Karies fördern"], "Z. B. bei Extraktionen kann es stark nachbluten: der Zahnarzt muss das vorher wissen."], ["Ein Patient nimmt Bisphosphonate. Welches Risiko besteht?", "Kiefernekrose nach chirurgischen Eingriffen", ["Allergie gegen Komposit", "Zahnverfärbung", "Mundtrockenheit durch Anästhesie"], "Bisphosphonate (Osteoporose, Krebs) können nach Extraktionen zu Knochennekrosen im Kiefer führen."], ["Wer darf die ZFA von der Schweigepflicht entbinden?", "Nur der Patient selbst", ["Der Zahnarzt", "Die Krankenkasse", "Der Ehepartner"], "Die Schweigepflicht schützt den Patienten: nur er kann (am besten schriftlich) entbinden."], ["Wo ist die Schweigepflicht gesetzlich geregelt?", "§ 203 StGB", ["§ 630a BGB", "SGB V", "Infektionsschutzgesetz"], "§ 203 Strafgesetzbuch: Verstöße sind strafbar."], ["Gilt die Schweigepflicht auch nach Ende deiner Ausbildung?", "Ja, zeitlich unbegrenzt", ["Nein, sie endet mit dem Vertrag", "Nur 1 Jahr lang", "Nur bei Privatpatienten"], "Die Schweigepflicht gilt auch nach dem Ausscheiden aus der Praxis und sogar über den Tod des Patienten hinaus."], ["Wie lange muss die Patientenakte aufbewahrt werden?", "10 Jahre nach Abschluss der Behandlung", ["2 Jahre", "5 Jahre", "30 Jahre"], "§ 630f BGB: 10 Jahre (andere Vorschriften können längere Fristen vorsehen)."], ["Was sind Gesundheitsdaten nach der DSGVO?", "Besonders schützenswerte personenbezogene Daten", ["Öffentliche Daten", "Anonyme Daten", "Nur Daten der Krankenkasse"], "Art. 9 DSGVO: besondere Kategorie: nur mit Rechtsgrundlage oder Einwilligung verarbeiten."], ["Welche Vertragsart ist der Behandlungsvertrag?", "Dienstvertrag", ["Werkvertrag", "Kaufvertrag", "Mietvertrag"], "Geschuldet ist eine fachgerechte Behandlung, nicht ein bestimmter Erfolg (§ 630a BGB)."], ["Wie muss die Aufklärung vor einem Eingriff erfolgen?", "Mündlich, rechtzeitig und verständlich", ["Nur durch einen Aushang", "Nur schriftlich per Post", "Erst nach dem Eingriff"], "§ 630e BGB: mündliches Gespräch, so rechtzeitig, dass der Patient in Ruhe entscheiden kann."], ["Ein 5-jähriges Kind kommt zur Behandlung. Wer schließt den Behandlungsvertrag?", "Die Eltern (gesetzliche Vertreter)", ["Das Kind selbst", "Die Kita", "Die Krankenkasse"], "Unter 7 Jahren ist man geschäftsunfähig (§ 104 BGB)."], ["Ein Privatpatient wird behandelt. Wer bekommt die Rechnung?", "Der Patient: nach GOZ", ["Die PKV direkt nach BEMA", "Die KZV", "Niemand, er zahlt bar"], "Der Patient ist Vertragspartner, zahlt und reicht die Rechnung bei seiner PKV ein."], ["Ein Patient hatte einen Arbeitsunfall (Zahn abgebrochen). Wer trägt die Kosten?", "Die Berufsgenossenschaft (gesetzl. Unfallversicherung)", ["Die Krankenkasse", "Der Arbeitgeber privat", "Der Patient"], "Bei Arbeits- und Wegeunfällen ist die gesetzliche Unfallversicherung zuständig."], ["„Das Wartezimmer ist voll.“ Welche Seite ist: „Beeil dich bitte!“?", "Appell", ["Sachinhalt", "Selbstoffenbarung", "Beziehung"], "Appell = was ich beim anderen erreichen will."], ["Welches Beispiel ist nonverbale Kommunikation?", "Blickkontakt und Lächeln", ["Ein Telefonat", "Eine E-Mail", "Lautes Sprechen"], "Nonverbal = Körpersprache. Lautstärke/Tonfall = paraverbal."], ["Welche Frage ist eine offene Frage?", "„Welche Beschwerden haben Sie genau?“", ["„Haben Sie Schmerzen?“", "„Sind Sie allergisch?“", "„Nehmen Sie Medikamente?“"], "Offene Fragen beginnen meist mit einem W-Wort und bringen mehr Infos."], ["Was hilft einem Angstpatienten am meisten?", "Ablauf erklären und ein Stopp-Zeichen vereinbaren", ["Die Angst ignorieren", "Lange im Wartezimmer warten lassen", "Viele Fachbegriffe benutzen"], "Kontrolle und Transparenz senken Angst."], ["Was bedeutet „Tell-Show-Do“?", "Erklären, zeigen, dann machen: Methode bei Kindern", ["Ein Abrechnungssystem", "Eine Notfallmaßnahme", "Ein Hygienekonzept"], "Das Kind wird schrittweise und ohne Überraschungen an die Behandlung herangeführt."], ["Patient wird im Stuhl blass, schwitzt und kippt weg (Kreislaufkollaps). Was tust du?", "Schocklage: Kopf tief, Beine hoch: Zahnarzt rufen", ["Aufrecht hinsetzen", "Etwas zu trinken geben", "Den Patienten allein lassen"], "Das Blut soll zurück zum Gehirn fließen. Bewusstlos? Dann Notruf 112."], ["Ein Diabetiker zittert, schwitzt, ist verwirrt, aber wach. Was ist richtig?", "Traubenzucker oder zuckerhaltiges Getränk geben", ["Insulin spritzen", "Gar nichts tun", "Kältespray geben"], "Typischer Unterzucker: Zucker hilft schnell. Nur geben, wenn der Patient schlucken kann."]]}, {"key": "lf3", "nr": "3", "titel": "Praxishygiene organisieren", "kompakt": [["Mikroorganismen", ["<b>Bakterien</b>: eigener Stoffwechsel, Antibiotika wirken. Einige bilden <b>Sporen</b> (sehr widerstandsfähig).", "<b>Viren</b>: kein eigener Stoffwechsel, vermehren sich nur in Wirtszellen. Antibiotika wirken nicht.", "<b>Pilze</b>: z. B. Candida albicans (Mundsoor).", "Übertragung: Kontakt, Tröpfchen, Aerosol (Spray!), Blut (HBV, HCV, HIV)."]], ["Begriffe & Wirkspektrum", ["<b>Desinfektion</b>: Keime so reduziert, dass keine Infektion mehr möglich ist.", "<b>Sterilisation</b>: Abtötung <b>aller</b> Mikroorganismen inkl. Sporen.", "bakterizid, fungizid, levurozid (Hefen), tuberkulozid, viruzid, sporizid.", "<b>Begrenzt viruzid</b> = gegen behüllte Viren (HBV, HCV, HIV). Viruzid = auch unbehüllte."]], ["Händehygiene & Schutz", ["Hygienische Händedesinfektion: <b>30 Sekunden</b>, Hände komplett benetzt.", "Kein Schmuck/Uhr, kurze <b>unlackierte</b> Nägel, keine künstlichen Nägel.", "PSA: Handschuhe, Mund-Nasen-Schutz, Schutzbrille, Schutzkleidung.", "Hepatitis-B-Impfung: Arbeitgeber muss sie <b>anbieten und bezahlen</b>."]], ["Risikoeinstufung Medizinprodukte", ["<b>Unkritisch</b>: nur intakte Haut (Blutdruckmanschette).", "<b>Semikritisch A</b>: Schleimhaut, einfach aufzubereiten (Mundspiegel, Sonde, Pinzette).", "<b>Semikritisch B</b>: Schleimhaut, erhöhte Anforderungen/Hohlräume (Hand-/Winkelstück, Turbine).", "<b>Kritisch A</b>: durchdringt Haut/Schleimhaut, einfach (Extraktionszange, Hebel, Skalpell).", "<b>Kritisch B</b>: durchdringt, erhöhte Anforderungen (chirurgisches Hand-/Winkelstück).", "Kritische Produkte: <b>verpackt sterilisieren</b>."]], ["Aufbereitung: Ablauf", ["Vorbereiten (grob reinigen, nicht antrocknen lassen) → <b>Reinigen & Desinfizieren</b> (bevorzugt maschinell im <b>RDG</b>) → Spülen/Trocknen.", "Kontrolle (sauber? heil?) → Pflege/Ölen → Funktionsprüfung → Verpacken → Kennzeichnen.", "<b>Sterilisation</b> → dokumentierte <b>Freigabe</b> durch sachkundige Person → staubgeschützt lagern.", "Dampf: <b>134 °C, 5 min</b> Haltezeit (oder 121 °C, 20 min). <b>Klasse B</b>: Vorvakuum: für Hohlkörper und Verpacktes.", "Tests: <b>Bowie-Dick/Helix-Test</b> (Dampfdurchdringung), Vakuumtest, Indikatoren, Chargendokumentation, Validierung."]], ["Praxisalltag", ["Flächen: <b>Wischdesinfektion</b> (nicht sprühen), patientennahe Flächen nach jedem Patienten.", "Wasserführende Systeme: morgens ca. <b>2 min</b>, nach jedem Patienten ca. 20 s durchspülen.", "Spitze Abfälle: <b>stich- und bruchfester</b> Behälter, kein Recapping. Amalgamabscheider ≥ <b>95 %</b>.", "Stich-/Schnittverletzung: <b>Blutung fördern</b> → desinfizieren → Zahnarzt informieren → <b>Durchgangsarzt</b> → dokumentieren/melden.", "Rechtliches: IfSG, MPDG, MPBetreibV, KRINKO/RKI-Empfehlung, TRBA 250, <b>Hygieneplan</b> (wer, was, wann, womit, wie)."]]], "fragen": [["Was unterscheidet Sterilisation von Desinfektion?", "Sterilisation tötet alle Mikroorganismen inkl. Sporen ab", ["Sterilisation reduziert Keime nur", "Es gibt keinen Unterschied", "Desinfektion tötet auch Sporen sicher ab"], "Desinfektion = infektionsfrei; Sterilisation = keimfrei (auch Sporen)."], ["Was gilt für Viren?", "Sie vermehren sich nur in Wirtszellen", ["Antibiotika wirken gut gegen sie", "Sie haben einen eigenen Stoffwechsel", "Sie sind größer als Bakterien"], "Viren sind auf fremde Zellen angewiesen: Antibiotika helfen nicht."], ["Ein Mittel ist „begrenzt viruzid“. Wogegen wirkt es?", "Gegen behüllte Viren (z. B. HBV, HCV, HIV)", ["Gegen alle Viren", "Gegen Sporen", "Nur gegen Pilze"], "Für unbehüllte Viren braucht man „viruzid“ (bzw. „begrenzt viruzid PLUS“ für einige)."], ["Wie lange dauert die hygienische Händedesinfektion?", "30 Sekunden", ["5 Sekunden", "3 Minuten", "10 Minuten"], "Hände müssen die ganze Zeit feucht bleiben. Die chirurgische dauert deutlich länger."], ["Was ist bei der Händehygiene erlaubt?", "Kurze, unlackierte Fingernägel", ["Ehering", "Armbanduhr", "Gelnägel"], "Schmuck, Uhren und künstliche Nägel sind Keimfallen."], ["Wie wird ein Mundspiegel eingestuft?", "Semikritisch A", ["Unkritisch", "Kritisch B", "Semikritisch B"], "Schleimhautkontakt, keine besonderen Anforderungen an die Aufbereitung."], ["Wie wird ein Winkelstück für die Füllungstherapie eingestuft?", "Semikritisch B", ["Semikritisch A", "Unkritisch", "Kritisch A"], "Schleimhautkontakt + Hohlräume = erhöhte Anforderungen."], ["Wie wird eine Extraktionszange eingestuft?", "Kritisch A", ["Semikritisch A", "Kritisch B", "Unkritisch"], "Kontakt mit Blut/Wunde, aber einfach aufzubereiten → kritisch A."], ["Wie wird ein chirurgisches Winkelstück eingestuft?", "Kritisch B", ["Kritisch A", "Semikritisch B", "Unkritisch"], "Durchdringt Gewebe und hat Hohlräume."], ["Welches Verfahren zur Reinigung und Desinfektion ist bevorzugt?", "Maschinell im RDG (Thermodesinfektor)", ["Nur mit Wasser abspülen", "Mit Spray einsprühen", "Im Ultraschallbad ohne Mittel"], "Maschinelle Verfahren sind validierbar und sicher."], ["Welches ist das Standardprogramm im Dampfsterilisator?", "134 °C, 5 Minuten Haltezeit", ["100 °C, 1 Minute", "60 °C, 30 Minuten", "180 °C, 2 Stunden"], "Alternative: 121 °C, 20 Minuten. (180 °C = alte Heißluft, nicht mehr Standard.)"], ["Wofür ist ein Klasse-B-Autoklav geeignet?", "Für verpackte Instrumente und Hohlkörper", ["Nur für unverpackte massive Instrumente", "Nur für Textilien", "Nur für Flüssigkeiten"], "Fraktioniertes Vorvakuum entfernt die Luft: Dampf kommt überall hin."], ["Was prüft der Bowie-Dick- bzw. Helix-Test?", "Die Dampfdurchdringung", ["Die Wasserhärte", "Die Raumtemperatur", "Die Haltbarkeit des Sterilguts"], "Er zeigt, ob Luft zuverlässig entfernt wurde und Dampf auch in Hohlräume gelangt."], ["Wann darf Sterilgut verwendet werden?", "Nach dokumentierter Freigabe durch eine sachkundige Person", ["Sofort nach dem Öffnen des Geräts", "Wenn es kalt ist", "Ohne Kontrolle"], "Freigabe nach Prüfung von Prozessparametern, Indikatoren und Verpackung."], ["Wie werden Flächen in der Praxis desinfiziert?", "Durch Wischdesinfektion", ["Durch Sprühdesinfektion", "Nur trocken abwischen", "Mit Spülmittel"], "Sprühen erzeugt Aerosole und benetzt nicht gleichmäßig."], ["Wie lange werden wasserführende Systeme morgens durchgespült?", "Ca. 2 Minuten", ["Gar nicht", "5 Sekunden", "1 Stunde"], "Gegen Biofilm/Keime aus stehendem Wasser; nach jedem Patienten ca. 20 s."], ["Was ist die erste Maßnahme nach einer Stichverletzung?", "Blutung fördern, dann desinfizieren", ["Wunde sofort zukleben", "Weiterarbeiten", "Mit Wasser abspülen und vergessen"], "Danach: Zahnarzt informieren, Durchgangsarzt, dokumentieren (Verbandbuch/Unfallanzeige)."], ["Wie entsorgst du eine gebrauchte Kanüle?", "Ohne Recapping in einen stich- und bruchfesten Behälter", ["Kappe wieder aufsetzen", "In den Hausmüll", "In den gelben Sack"], "Recapping ist die häufigste Ursache für Stichverletzungen."], ["Wer bezahlt die Hepatitis-B-Impfung für die ZFA?", "Der Arbeitgeber", ["Die ZFA selbst", "Die Berufsschule", "Niemand, sie ist freiwillig und privat"], "Arbeitsschutz: Der Arbeitgeber muss sie kostenlos anbieten."], ["Was steht im Hygieneplan?", "Wer was wann womit wie reinigt/desinfiziert", ["Der Dienstplan", "Die Abrechnungsziffern", "Die Urlaubsplanung"], "Der Hygieneplan legt alle Hygienemaßnahmen der Praxis verbindlich fest."], ["Welchen Abscheidegrad muss ein Amalgamabscheider mindestens haben?", "95 %", ["50 %", "75 %", "10 %"], "Amalgam darf nicht ins Abwasser: auch nach dem Amalgamverbot fallen bei Entfernungen noch Reste an."]]}, {"key": "lf4", "nr": "4", "titel": "Kariestherapie begleiten", "kompakt": [["Zahnhartsubstanzen", ["<b>Schmelz</b>: ca. 95-97 % anorganisch (Hydroxylapatit), härteste Substanz, keine Nerven, wächst nicht nach.", "<b>Dentin</b>: ca. 70 % anorganisch, Dentinkanälchen mit Odontoblastenfortsätzen → <b>schmerzempfindlich</b>. Bildet Tertiärdentin als Reaktion.", "<b>Wurzelzement</b>: bedeckt die Wurzel. <b>Pulpa</b>: Nerven, Gefäße, Bindegewebe."]], ["Karies", ["Plaque-Bakterien (<b>Streptococcus mutans</b>, Laktobazillen) machen aus Zucker <b>Säure</b> → Demineralisation.", "Kritischer pH-Wert Schmelz: ca. <b>5,5</b>.", "4 Faktoren: <b>Wirt (Zahn), Mikroorganismen, Substrat (Zucker), Zeit</b>.", "Stadien: Initialkaries (<b>White Spot</b>, reversibel) → superficialis (Schmelz) → media (Dentin) → <b>profunda</b> (pulpanah).", "Diagnose: Spiegel & Sonde, <b>Bissflügel-Röntgen</b> (approximal), Kältetest, Laserfluoreszenz."]], ["Kavitätenklassen nach Black", ["<b>I</b>: Grübchen & Fissuren. <b>II</b>: approximal Seitenzähne.", "<b>III</b>: approximal Frontzähne ohne Schneidekante. <b>IV</b>: Frontzahn mit Schneidekante.", "<b>V</b>: Zahnhals (zervikal). (VI: Höckerspitzen/Schneidekanten)"]], ["Zahnschema & Flächen", ["FDI: Quadrant 1 OK rechts, 2 OK links, 3 UK links, 4 UK rechts (aus Patientensicht). Milchzähne: 5-8.", "Flächen: m (mesial), d (distal), o (okklusal), i (inzisal), v/b (vestibulär/bukkal), l/p (lingual/palatinal)."]], ["Ablauf Füllungstherapie", ["Befund/Röntgen → <b>Anästhesie</b> → Trockenlegung → Präparation & Kariesentfernung → ggf. Unterfüllung → Matrize/Keil → Füllung → Ausarbeiten → <b>Okklusionskontrolle</b> → Politur.", "Anästhesie: Oberfläche, <b>Infiltration</b> (v. a. OK), <b>Leitung</b> (UK: N. alveolaris inferior am Foramen mandibulae). Vorher <b>aspirieren</b>. Adrenalin-Zusatz = längere Wirkung, weniger Blutung.", "Trockenlegung: relativ (Watterollen, Sauger) oder absolut (<b>Kofferdam</b>).", "Winkelstücke: <b>rot</b> = ins Schnelle (1:5), <b>blau</b> = 1:1, <b>grün</b> = Untersetzung. Turbine bis ca. 400.000 U/min, immer mit Spraykühlung."]], ["Materialien", ["<b>Calciumhydroxid</b>: pulpanah, pH ca. 12, antibakteriell, regt Tertiärdentin an (Cp / P).", "<b>Komposit</b>: Adhäsivtechnik: Schmelz mit <b>Phosphorsäure (30-40 %)</b> ätzen, Primer/Bond, Schichten max. <b>2 mm</b>, Lichthärtung (blau).", "<b>Kein Eugenol</b> (Zinkoxid-Eugenol) unter Komposit: hemmt die Aushärtung.", "Glasionomerzement: haftet chemisch, gibt Fluorid ab. <b>Amalgam</b>: EU-Verbot seit 1.1.2025 (nur noch medizinische Ausnahmen).", "Matrize (z. B. Tofflemire) + <b>Holzkeil</b> bei Klasse II, Strips bei Frontzähnen."]], ["BEMA (Kasse)", ["Füllungen: <b>F1</b> (13a) einflächig, <b>F2</b> (13b) zweiflächig, <b>F3</b> (13c) dreiflächig, <b>F4</b> (13d) mehr als dreiflächig.", "<b>Cp</b> (25) indirekte, <b>P</b> (26) direkte Überkappung. <b>I</b> (40) Infiltration, <b>L1</b> (41a) Leitung. <b>ViPr</b> (8). <b>bMF</b> (12)."]]], "fragen": [["Welche Zahnhartsubstanz ist die härteste?", "Schmelz", ["Dentin", "Wurzelzement", "Pulpa"], "Schmelz besteht zu ca. 95-97 % aus anorganischem Material (Hydroxylapatit)."], ["Warum ist Dentin schmerzempfindlich?", "Es enthält Dentinkanälchen mit Odontoblastenfortsätzen", ["Es enthält Blutgefäße", "Es ist härter als Schmelz", "Es hat keine Verbindung zur Pulpa"], "Reize werden über die Flüssigkeit in den Kanälchen zur Pulpa weitergeleitet."], ["Welches Bakterium gilt als Hauptverursacher der Karies?", "Streptococcus mutans", ["Candida albicans", "Escherichia coli", "Staphylococcus aureus"], "S. mutans baut Zucker zu Säure ab und haftet gut am Zahn."], ["Ab welchem pH-Wert wird Schmelz demineralisiert (ca.)?", "5,5", ["7,5", "9", "3"], "Unter dem kritischen pH-Wert lösen sich Mineralien aus dem Schmelz."], ["Welche vier Faktoren braucht Karies?", "Zahn, Bakterien, Zucker, Zeit", ["Speichel, Fluorid, Zahnbürste, Zeit", "Zahn, Zahnfleisch, Knochen, Zeit", "Bakterien, Viren, Pilze, Zeit"], "Wirt + Mikroorganismen + Substrat + Zeit (Keyes/König)."], ["Was gilt für eine Initialkaries (White Spot)?", "Sie ist durch Remineralisation/Fluorid umkehrbar", ["Sie muss sofort gefüllt werden", "Sie liegt schon im Dentin", "Sie ist schwarz verfärbt"], "Die Oberfläche ist noch intakt: Fluorid und gute Pflege können sie stoppen."], ["Was bedeutet Caries profunda?", "Tiefe, pulpanahe Karies", ["Karies nur im Schmelz", "Karies an der Wurzel", "Stillstehende Karies"], "superficialis = Schmelz, media = Dentin, profunda = nah an der Pulpa."], ["Black-Klasse II betrifft …", "… Approximalflächen der Seitenzähne", ["… Fissuren", "… den Zahnhals", "… Frontzähne mit Schneidekante"], "Klasse II = Prämolaren/Molaren approximal."], ["Black-Klasse V betrifft …", "… den Zahnhals (zervikal)", ["… Fissuren", "… Höckerspitzen", "… Frontzähne approximal"], "Zervikale Defekte, z. B. am Zahnhals vestibulär."], ["Black-Klasse IV ist …", "… approximal am Frontzahn mit Schneidekante", ["… approximal am Frontzahn ohne Schneidekante", "… okklusal am Molaren", "… am Zahnhals"], "III = ohne Schneidekante, IV = mit Schneidekante."], ["Mit welcher Röntgenaufnahme findet man Approximalkaries am besten?", "Bissflügelaufnahme", ["OPG", "Fernröntgen", "DVT"], "Bissflügel (Bitewing) zeigen die Kontaktpunkte von OK und UK."], ["Welcher Zahn ist 36?", "Erster Molar Unterkiefer links", ["Erster Molar Oberkiefer rechts", "Eckzahn Unterkiefer links", "Zweiter Molar Unterkiefer rechts"], "Quadrant 3 = UK links, Zahn 6 = erster Molar."], ["Welcher Zahn ist 55?", "Zweiter Milchmolar Oberkiefer rechts", ["Zweiter Prämolar OK rechts", "Erster Milchmolar UK links", "Milcheckzahn OK rechts"], "Quadrant 5 = Milchzähne OK rechts; 5 = zweiter Milchmolar."], ["Wo wird bei der Leitungsanästhesie im UK betäubt?", "Am Foramen mandibulae (N. alveolaris inferior)", ["Am Gaumen", "Direkt am Zahn im OK", "Am Kiefergelenk"], "Dadurch wird die ganze UK-Hälfte inkl. Unterlippe/Zunge taub."], ["Warum wird vor der Injektion aspiriert?", "Um eine Injektion in ein Blutgefäß zu vermeiden", ["Um Speichel abzusaugen", "Um die Spritze zu kühlen", "Um Luft zu entfernen"], "Kommt Blut in die Karpule, muss die Nadel neu positioniert werden."], ["Wozu dient der Adrenalin-Zusatz im Anästhetikum?", "Längere Wirkdauer und weniger Blutung", ["Schnellerer Wirkungseintritt durch Gefäßerweiterung", "Besserer Geschmack", "Desinfektion"], "Adrenalin verengt die Gefäße: das Mittel bleibt länger vor Ort."], ["Was ist absolute Trockenlegung?", "Kofferdam", ["Watterollen", "Speichelsauger", "Luftpuster"], "Kofferdam isoliert den Zahn komplett von Speichel."], ["Was bedeutet ein rotes Winkelstück?", "Übersetzung ins Schnelle (z. B. 1:5)", ["Untersetzung (langsamer)", "Übersetzung 1:1", "Nur für Prophylaxe"], "Rot = schnell, blau = 1:1, grün = langsam."], ["Warum wird Calciumhydroxid bei Caries profunda verwendet?", "Es wirkt antibakteriell und regt Tertiärdentin an", ["Es ist das Füllungsmaterial selbst", "Es färbt den Zahn weiß", "Es betäubt den Zahn"], "Hoher pH-Wert (ca. 12) = antibakteriell; Schutz der Pulpa."], ["Womit wird der Schmelz bei der Adhäsivtechnik geätzt?", "Phosphorsäure 30-40 %", ["Salzsäure", "Natriumhypochlorit", "Wasserstoffperoxid"], "Es entsteht ein Ätzmuster, an dem der Kunststoff mechanisch haftet."], ["Warum wird Komposit in Schichten (max. 2 mm) gelegt?", "Wegen Polymerisationsschrumpfung und vollständiger Aushärtung", ["Weil es sonst zu hart wird", "Wegen der Farbe", "Weil es billiger ist"], "Dünne Schichten härten sicher durch und schrumpfen weniger: weniger Randspalt."], ["Warum kein Zinkoxid-Eugenol unter Komposit?", "Eugenol hemmt die Aushärtung des Komposits", ["Es ist zu teuer", "Es ist radioaktiv", "Es klebt zu stark"], "Darum unter Komposit z. B. Calciumhydroxid oder Glasionomerzement."], ["Wozu dient der Holzkeil bei einer Klasse-II-Füllung?", "Matrize am Zahnhals anpressen und Überhänge vermeiden", ["Den Mund offen halten", "Die Füllung polieren", "Die Betäubung verstärken"], "Er separiert die Zähne leicht: so entsteht ein guter Kontaktpunkt."], ["Was gilt seit dem 1.1.2025 für Amalgam?", "EU-weit grundsätzlich nicht mehr verwendet (nur med. Ausnahmen)", ["Es ist Standard für alle Kassenpatienten", "Nur bei Kindern erlaubt", "Nur noch für Frontzähne"], "Kassen-Alternativen sind z. B. selbstadhäsive Materialien/Komposit."], ["Eine Füllung mod an Zahn 46 (BEMA) ist …", "F3 (13c)", ["F1 (13a)", "F2 (13b)", "F4 (13d)"], "m + o + d = drei Flächen = dreiflächig."], ["Wie heißt die indirekte Überkappung im BEMA?", "Cp (25)", ["P (26)", "I (40)", "bMF (12)"], "Cp = indirekt (Pulpa nicht eröffnet), P = direkt (Pulpa punktförmig eröffnet)."], ["Wozu dient Okklusionsfolie?", "Zur Kontrolle von Bisskontakten/Frühkontakten", ["Zum Trockenlegen", "Zum Abdecken der Füllung", "Zum Separieren"], "Zu hohe Füllungen werden so sichtbar und eingeschliffen."]]}, {"key": "lf5", "nr": "5", "titel": "Endodontische Behandlungen begleiten", "kompakt": [["Pulpa & Erkrankungen", ["Pulpa: Nerven, Blutgefäße, Bindegewebe, Odontoblasten. Kronen- und Wurzelpulpa; Austritt am <b>Foramen apicale</b>.", "<b>Reversible Pulpitis</b>: kurzer Schmerz auf kalt/süß, hört schnell auf.", "<b>Irreversible Pulpitis</b>: anhaltend, pochend, nachts, <b>Wärme verstärkt</b>.", "<b>Nekrose</b>: Pulpa abgestorben, Kältetest negativ. <b>Gangrän</b>: Nekrose + Fäulnisbakterien (Geruch).", "<b>Apikale Parodontitis</b>: akut = Aufbiss-/Klopfschmerz; chronisch = oft ohne Beschwerden, Röntgen: Aufhellung an der Wurzelspitze. Folgen: Abszess, Fistel, Granulom, Zyste."]], ["Diagnostik", ["Sensibilitätstest (<b>Kältespray</b> auf Wattepellet), <b>Perkussion</b> (Klopftest), Palpation, Röntgen (Einzelzahnfilm)."]], ["Therapie-Möglichkeiten", ["Vitalerhaltend: <b>Cp</b> (indirekte), <b>P</b> (direkte Überkappung), <b>Pulpotomie</b> (Kronenpulpa weg, Wurzelpulpa bleibt).", "<b>Wurzelkanalbehandlung</b> (WKB) bei irreversibler Pulpitis/Nekrose.", "<b>Wurzelspitzenresektion</b> (WSR): chirurgisch, wenn Entzündung trotz WF bleibt."]], ["Ablauf WKB", ["Röntgen → Anästhesie → <b>Kofferdam</b> → <b>Trepanation</b> (Eröffnen) → Exstirpation (Nerv entfernen) → <b>Längenbestimmung</b> (Röntgenmessaufnahme / Apexlocator).", "→ <b>Aufbereitung</b> (Feilen, Hand oder maschinell NiTi) mit ständiger <b>Spülung</b> → <b>medikamentöse Einlage</b> (Calciumhydroxid) + provisorischer Verschluss.", "→ <b>Wurzelfüllung</b> (Guttapercha + Sealer) → Röntgenkontrolle → definitive Versorgung."]], ["Spüllösungen", ["<b>NaOCl</b> (Natriumhypochlorit, ca. 1-5 %): löst Gewebe auf + desinfiziert. Nicht über die Wurzelspitze pressen!", "<b>EDTA</b> (17 %): entfernt die Schmierschicht (Smear Layer). <b>CHX</b> (2 %): antibakteriell.", "NaOCl + CHX direkt nacheinander → <b>brauner Niederschlag</b>: dazwischen spülen (z. B. NaCl)."]], ["Instrumente", ["ISO-Nummer = Spitzendurchmesser in <b>1/100 mm</b> (ISO 25 = 0,25 mm).", "Farben: 06 rosa, 08 grau, 10 lila, 15 <b>weiß</b>, 20 <b>gelb</b>, 25 <b>rot</b>, 30 <b>blau</b>, 35 <b>grün</b>, 40 <b>schwarz</b>: ab 45 wiederholt sich weiß-gelb-rot-blau-grün-schwarz.", "Exstirpationsnadel (Nerv entfernen), K-Feile, Reamer, <b>Hedström-Feile (nur ziehen!)</b>, Silikonstopper (Arbeitslänge).", "<b>Papierspitzen</b> (trocknen), <b>Lentulo</b> (Sealer einbringen), Guttaperchaspitzen, <b>Spreader</b> (laterale Kondensation), Plugger (vertikal).", "Komplikationen: Instrumentenfraktur, <b>Via falsa</b> (Perforation), Aspiration/Verschlucken, Hypochlorit-Zwischenfall."]], ["Kanalanzahl (meistens)", ["Frontzähne: 1 Kanal · erster OK-Prämolar: 2 · OK-Molaren: 3 (oft 4) · UK-Molaren: 3 (2 mesial, 1 distal)."]], ["BEMA Endo", ["<b>Trep1</b> (31) Trepanation, <b>VitE</b> (28) Vitalexstirpation je Kanal, <b>WK</b> (32) Aufbereitung je Kanal.", "<b>Med</b> (34) med. Einlage, <b>WF</b> (35) Wurzelfüllung je Kanal, <b>Pulp</b> (27) Pulpotomie, <b>Dev</b> (29) Devitalisierung."]]], "fragen": [["Typisches Zeichen einer irreversiblen Pulpitis?", "Anhaltender, pochender Schmerz, auch nachts", ["Kurzer Schmerz nur auf Süßes", "Gar keine Beschwerden", "Schmerz nur beim Zähneputzen am Zahnfleisch"], "Wärme verstärkt oft den Schmerz, Kälte kann lindern: die Pulpa erholt sich nicht mehr."], ["Wie reagiert ein Zahn mit Pulpanekrose auf den Kältetest?", "Negativ (keine Reaktion)", ["Stark positiv", "Mit Blutung", "Mit Verfärbung"], "Abgestorbene Nerven können keinen Reiz weiterleiten."], ["Typisch für eine akute apikale Parodontitis?", "Klopf- und Aufbissschmerz", ["Weißer Fleck auf dem Schmelz", "Nur Kälteempfindlichkeit", "Zahnfleischbluten beim Putzen"], "Die Entzündung sitzt an der Wurzelspitze: Druck auf den Zahn schmerzt."], ["Was ist eine Gangrän?", "Abgestorbene Pulpa mit Fäulnisbakterien", ["Eine gesunde Pulpa", "Eine Füllung", "Eine Zahnfleischtasche"], "Erkennbar oft am fauligen Geruch bei der Trepanation."], ["Womit wird die Sensibilität getestet?", "Mit Kältespray auf einem Wattepellet", ["Mit der Sonde in der Fissur", "Mit Phosphorsäure", "Mit Okklusionsfolie"], "Positive Reaktion = Pulpa reagiert (sensibel)."], ["Was passiert bei der Pulpotomie?", "Die Kronenpulpa wird entfernt, die Wurzelpulpa bleibt", ["Die ganze Pulpa wird entfernt", "Der Zahn wird gezogen", "Die Wurzelspitze wird abgetrennt"], "Vitalerhaltend, v. a. bei Milchzähnen und jungen Zähnen."], ["Was ist eine Trepanation?", "Eröffnen des Pulpenkavums", ["Füllen des Kanals", "Röntgen des Zahns", "Entfernen der Wurzelspitze"], "Erster Schritt der Wurzelkanalbehandlung (BEMA Trep1)."], ["Warum ist Kofferdam bei der Endo so wichtig?", "Schutz vor Verschlucken/Einatmen von Feilen und Speichelkontamination", ["Damit der Patient besser sprechen kann", "Für die Abrechnung", "Damit die Betäubung wirkt"], "Kleine Instrumente + keimfreies Arbeiten = Kofferdam."], ["Wie wird die Arbeitslänge bestimmt?", "Röntgenmessaufnahme und/oder Apexlocator", ["Mit dem Lineal außen am Zahn", "Durch Schätzen", "Mit Okklusionsfolie"], "Apexlocator = elektronisch (endometrisch)."], ["Welche Farbe hat ISO 25?", "Rot", ["Gelb", "Blau", "Grün"], "15 weiß: 20 gelb: 25 rot: 30 blau: 35 grün: 40 schwarz."], ["Welche Farbe hat ISO 15?", "Weiß", ["Rot", "Schwarz", "Lila"], "Merke: weiß-gelb-rot-blau-grün-schwarz ab 15."], ["Was bedeutet die Zahl auf der ISO-Feile?", "Spitzendurchmesser in 1/100 mm", ["Länge in mm", "Anzahl der Windungen", "Härtegrad"], "ISO 30 = 0,30 mm an der Spitze."], ["Wie wird mit einer Hedström-Feile gearbeitet?", "Nur ziehend, nicht drehen", ["Nur drehend", "Nur stoßend", "Maschinell mit Turbine"], "Drehen kann sie leicht brechen lassen."], ["Wofür ist der Silikonstopper an der Feile?", "Markiert die Arbeitslänge", ["Schützt vor Bruch", "Desinfiziert den Kanal", "Hält die Feile fest"], "Er wird auf die gemessene Länge eingestellt."], ["Was ist die wichtigste Spüllösung in der Endo?", "Natriumhypochlorit (NaOCl)", ["Phosphorsäure", "Leitungswasser", "Alkohol 70 %"], "Löst organisches Gewebe auf und desinfiziert."], ["Wofür wird EDTA verwendet?", "Zum Entfernen der Schmierschicht (Smear Layer)", ["Zum Betäuben", "Als Wurzelfüllung", "Zum Trocknen"], "EDTA bindet Calcium (Chelator) und öffnet die Dentinkanälchen."], ["Was passiert, wenn NaOCl und CHX direkt aufeinandertreffen?", "Es entsteht ein brauner Niederschlag", ["Nichts", "Die Wirkung verdoppelt sich", "Es wird steril"], "Deshalb zwischen beiden mit z. B. Kochsalzlösung spülen."], ["Welches Material wird als medikamentöse Einlage verwendet?", "Calciumhydroxid", ["Komposit", "Amalgam", "Phosphorsäure"], "Antibakteriell durch hohen pH-Wert, zwischen den Sitzungen (BEMA Med)."], ["Woraus besteht die Wurzelfüllung meist?", "Guttapercha + Sealer", ["Komposit + Bond", "Amalgam", "Glasionomerzement allein"], "Guttapercha-Stifte füllen, der Sealer dichtet die Spalten ab."], ["Wofür sind Papierspitzen?", "Zum Trocknen des Kanals", ["Zum Aufbereiten", "Zum Messen der Länge", "Zum Füllen"], "Vor der Wurzelfüllung muss der Kanal trocken sein."], ["Wofür wird ein Lentulo benutzt?", "Sealer/Paste in den Kanal einbringen", ["Nerv entfernen", "Guttapercha abschneiden", "Kanal erweitern"], "Spiralförmig, rotierend im langsamen Winkelstück."], ["Wofür ist der Spreader?", "Laterale Kondensation der Guttapercha", ["Zum Trepanieren", "Zum Spülen", "Zum Messen"], "Er drückt die Guttapercha seitlich an: Platz für weitere Stifte."], ["Was ist eine Via falsa?", "Ein künstlich falsch angelegter Kanal (Perforation)", ["Ein zusätzlicher natürlicher Kanal", "Eine Füllungsart", "Eine Spüllösung"], "Komplikation bei der Aufbereitung."], ["Wie viele Wurzelkanäle hat ein UK-Sechser meistens?", "3", ["1", "2", "5"], "Meist 2 mesial + 1 distal."], ["Welche BEMA-Position ist die Wurzelfüllung je Kanal?", "WF (35)", ["WK (32)", "Trep1 (31)", "Med (34)"], "VitE 28: Trep1 31: WK 32: Med 34: WF 35."], ["Wann macht man eine Wurzelspitzenresektion?", "Wenn die Entzündung an der Wurzelspitze trotz Wurzelfüllung bleibt", ["Bei jeder Karies", "Bei White Spots", "Vor jeder Füllung"], "Chirurgische Entfernung der Wurzelspitze inkl. entzündetem Gewebe."]]}];
const COL = {lf2:"#0f766e",lf3:"#1d4ed8",lf4:"#b45309",lf5:"#9d174d",mix:"#6d28d9",err:"#c2410c"};
// ---------- Speicher (nur auf diesem Gerät)
const KEY="zfaLF_stand";
let S={best:{},wrong:{},done:0,right:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const allQ=[];DATA.forEach(l=>l.fragen.forEach((f,i)=>allQ.push({id:l.key+"-"+i,lf:l,f})));
const byId=id=>allQ.find(q=>q.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=document.getElementById("app");
const esc=s=>String(s);
let quiz=null, confirmReset=false;

function home(){
  const wrongN=Object.keys(S.wrong).length;
  const pct=S.done?Math.round(S.right/S.done*100):0;
  let h=`<a href="index.html" style="color:var(--mut);font-size:14px;text-decoration:none">‹ Wirtschaft-App</a><h1>ZFA Quiz 🦷</h1><p class="sub">Lernfeld 2 · 3 · 4 · 5, jeden Tag 1 %</p>
  <div class="stats"><div class="stat"><b>${S.done}</b><span>beantwortet</span></div>
  <div class="stat"><b>${pct}%</b><span>richtig</span></div>
  <div class="stat"><b>${wrongN}</b><span>zum Üben</span></div></div>
  <div class="extra">
   <button class="tile" onclick="start('daily')"><b>⚡ 5 am Tag</b><span>5 zufällige Fragen</span></button>
   <button class="tile" onclick="start('err')"><b>🔁 Fehler üben</b><span>${wrongN} offene Fragen</span></button>
   <button class="tile" onclick="start('mix')" style="grid-column:span 2"><b>🎲 Alles gemischt</b><span>${allQ.length} Fragen aus allen Lernfeldern</span></button>
  </div>`;
  DATA.forEach(l=>{
    const best=S.best[l.key]||0, n=l.fragen.length;
    h+=`<div class="lf" style="--c:${COL[l.key]}"><div class="tag">LERNFELD ${l.nr}</div><h3>${l.titel}</h3>
    <div class="bar"><i style="width:${Math.round(best/n*100)}%"></i></div>
    <div class="meta">Bestes Ergebnis: ${best} / ${n}</div>
    <div class="btns"><button class="btn" onclick="learn('${l.key}')">📖 Wissen</button>
    <button class="btn p" onclick="start('${l.key}')">▶ Quiz starten</button></div></div>`;
  });
  h+= confirmReset
   ? `<div class="confirm">Fortschritt wirklich löschen?<div class="btns"><button class="btn" onclick="confirmReset=false;home()">Abbrechen</button><button class="btn p" style="--c:#c2410c" onclick="doReset()">Löschen</button></div></div>`
   : `<button class="reset" onclick="confirmReset=true;home()">Fortschritt zurücksetzen</button>`;
  $.innerHTML=h; scrollTo(0,0);
}
function doReset(){S={best:{},wrong:{},done:0,right:0};save();confirmReset=false;home()}

function learn(k){
  const l=DATA.find(x=>x.key===k);
  let h=`<div class="top" style="--c:${COL[k]}"><button class="back" onclick="home()">‹</button><div class="t">Kompaktwissen<small>LF ${l.nr} · ${l.titel}</small></div></div>`;
  l.kompakt.forEach(([t,pts])=>{h+=`<div class="wis" style="--c:${COL[k]}"><h4>${t}</h4><ul>${pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>`});
  h+=`<button class="btn p wide" style="--c:${COL[k]}" onclick="start('${k}')">▶ Jetzt Quiz starten</button>`;
  $.innerHTML=h; scrollTo(0,0);
}

function start(mode){
  let qs, title, c=COL[mode]||COL.mix;
  if(mode==="mix"){qs=shuffle(allQ);title="Alles gemischt"}
  else if(mode==="daily"){qs=shuffle(allQ).slice(0,5);title="5 am Tag";c="#0f766e"}
  else if(mode==="err"){qs=shuffle(Object.keys(S.wrong).map(byId).filter(Boolean));title="Fehler üben";c=COL.err;
    if(!qs.length){$.innerHTML=`<div class="top"><button class="back" onclick="home()">‹</button><div class="t">Fehler üben</div></div><div class="empty">🎉 Keine offenen Fehler!<br>Mach ein Quiz. Falsche Antworten landen automatisch hier.</div>`;return}}
  else{const l=DATA.find(x=>x.key===mode);qs=shuffle(allQ.filter(q=>q.lf.key===mode));title="LF "+l.nr+" · "+l.titel}
  quiz={mode,title,c,qs:qs.map(q=>({...q,opts:shuffle([q.f[1],...q.f[2]])})),i:0,right:0,answered:false,wrongs:[]};
  showQ();
}

function showQ(){
  const z=quiz,q=z.qs[z.i],n=z.qs.length,c=z.mode.startsWith("lf")?z.c:COL[q.lf.key];
  let h=`<div class="top"><button class="back" onclick="home()">‹</button><div class="t">${z.title}</div></div>
  <div class="prog" style="--c:${z.c}"><div class="bar"><i style="width:${z.i/n*100}%"></i></div><span>${z.i+1}/${n}</span></div>
  <div class="qcard" style="--c:${c}"><div class="lbl">LF ${q.lf.nr} · FRAGE ${z.i+1}</div><h2>${q.f[0]}</h2></div><div id="opts">`;
  q.opts.forEach((o,j)=>{h+=`<button class="opt" data-j="${j}" onclick="pick(${j})"><span class="l">${"ABCD"[j]}</span><span>${o}</span></button>`});
  h+=`</div><div id="after"></div>`;
  $.innerHTML=h; scrollTo(0,0);
}

function pick(j){
  const z=quiz; if(z.answered)return; z.answered=true;
  const q=z.qs[z.i], ok=q.opts[j]===q.f[1];
  document.querySelectorAll(".opt").forEach((b,k)=>{
    if(q.opts[k]===q.f[1])b.classList.add("ok"); else if(k===j)b.classList.add("bad"); else b.classList.add("dim");
  });
  S.done++; if(ok){S.right++;z.right++;delete S.wrong[q.id]} else {S.wrong[q.id]=1;z.wrongs.push(q)}
  save();
  const last=z.i===z.qs.length-1;
  document.getElementById("after").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"✓ Richtig!":"✗ Leider falsch. Richtig ist: "+q.f[1]}</b>${q.f[3]}</div>
  <button class="btn p wide" style="--c:${z.c}" onclick="next()">${last?"Ergebnis ansehen":"Weiter →"}</button>`;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function next(){const z=quiz;z.answered=false;z.i++; if(z.i<z.qs.length)showQ(); else result()}

function result(){
  const z=quiz,n=z.qs.length,p=Math.round(z.right/n*100);
  if(z.mode.startsWith("lf")) S.best[z.mode]=Math.max(S.best[z.mode]||0,z.right);
  save();
  const msg=p===100?"Perfekt! 🏆":p>=80?"Sehr stark! 💪":p>=50?"Gut dabei! 👍":"Dranbleiben, 1 % jeden Tag 🌱";
  let h=`<div class="top"><button class="back" onclick="home()">‹</button><div class="t">${z.title}</div></div>
  <div class="res"><div class="ring" style="--c:${z.c};--p:${p}"><div>${p}%</div></div><h2>${msg}</h2><p class="sub">${z.right} von ${n} richtig</p></div>
  <div class="btns"><button class="btn" onclick="home()">Startseite</button><button class="btn p" style="--c:${z.c}" onclick="start('${z.mode}')">Nochmal</button></div>`;
  if(z.wrongs.length){h+=`<div class="list"><h3 style="font-size:16px;margin:20px 0 8px">Das solltest du dir nochmal ansehen</h3>`+
    z.wrongs.map(q=>`<div class="wr">${q.f[0]}<br><b>→ ${q.f[1]}</b></div>`).join("")+`</div>`}
  $.innerHTML=h; scrollTo(0,0);
}
home();
</script>
</body>
</html>
